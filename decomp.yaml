tools:
  asmlift:
    # asmlift's symbol source: the DOL's ELF, which the ordinary matching build already links
    # (`python3 configure.py && ninja`). It carries a sized .symtab (names, addresses and
    # st_size for every DOL function and object) and no DWARF.
    # It covers the DOL ONLY. The 99 REL modules (81% of the code) are linked into separate
    # relocatable ELFs, build/GMPE01_00/<module>/<module>.plf, and this key names one file,
    # so REL functions get no symbol map from it.
    elf: build/GMPE01_00/main.elf
